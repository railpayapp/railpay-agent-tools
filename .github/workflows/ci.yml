name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # railpay-sdk is a pinned release tarball (see package.json), so no second checkout is needed.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the build is self-contained
        run: |
          if grep -nE "from ['\"](viem|railpay-sdk)['\"]" dist/*.js dist/*.d.ts; then
            echo "dist imports a package that is not a dependency"
            exit 1
          fi
